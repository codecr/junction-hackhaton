# Amplify Hosting build for the static site (landing at /, demo at /demo/).
# The site is assembled from the repo root (site/landing + packages/web/dist-demo), so the
# Amplify app is connected at the repository root: do not set AMPLIFY_MONOREPO_APP_ROOT.
# SPA rewrite for /demo/<*> lives in site/amplify-custom-rules.json (Amplify console or CLI).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node --version
        - npm ci
    build:
      commands:
        - npm run build:demo -w @junction/web
        - node scripts/assemble-site.mjs
  artifacts:
    baseDirectory: site-dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
